[package]
name = "farfield-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
diffy = "0.5.2"
directories = "6.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
parking_lot = "0.12.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "multipart", "gzip", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
tempfile = "3.27.0"

# Credentials live in the platform secret store: Keychain on macOS and iOS,
# the Secret Service on Linux. Nothing secret is ever written to disk here.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
