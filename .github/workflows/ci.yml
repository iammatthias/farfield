name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: go.work.sum

      - name: gofmt
        run: |
          files=$(gofmt -l apps lib)
          if [ -n "$files" ]; then
            echo "gofmt needed on:"
            echo "$files"
            exit 1
          fi

      - run: make vet

      - run: make test

      - run: make race

      - name: Obsidian plugin harness
        run: node obsidian-plugin/farfield-sync/test.js

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: go.work.sum

      - run: make build

      - name: Start dev fleet
        run: scripts/devfleet.sh start

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: make e2e
        env:
          E2E_API_KEY: dev-content-key

      - name: Stop dev fleet
        if: always()
        run: scripts/devfleet.sh stop

      - name: Upload fleet logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devfleet-logs
          path: tmp/dev/logs
