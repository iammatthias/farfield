{{/* qr: the shared layout supplies the shell and masthead, and the theme
    supplies fields, tables, table.stack and td.actions; only this app's own
    styles and partials live here. */}}

{{define "styles"}}
  <style>
    .container { max-width: 60rem; }

    table.admin td { vertical-align: middle; }
    table.admin td.payload {
      max-width: 22rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    table.admin td.mode, table.admin td.id { color: var(--ink-2); white-space: nowrap; }

    /* the counts line above the table — a technical readout */

    /* QR preview on the edit form: the code beside its facts. The SVG
       carries its own white quiet zone, so it needs no frame or plate. */
    .qr-panel {
      display: grid; gap: var(--s-5) var(--s-6);
      grid-template-columns: minmax(0, 14rem) minmax(0, 1fr);
      align-items: start;
    }
    .qr-panel figure { display: flex; flex-direction: column; gap: var(--s-2); }
    .qr-panel figure svg { width: 100%; height: auto; border-radius: var(--r-s); }
    .qr-meta dl {
      display: grid; grid-template-columns: auto minmax(0, 1fr);
      gap: var(--s-1) var(--s-4); margin: 0;
      font-size: 0.85rem;
    }
    .qr-meta dt { line-height: 1.9; }
    .qr-meta dd { margin: 0; color: var(--ink-2); word-break: break-all; }
    .qr-meta .label { margin-top: var(--s-5); }
    .qr-meta .hint { margin-top: var(--s-3); }

    .endpoints {
      display: grid; gap: var(--s-2);
      margin: var(--s-2) 0 0;
      font-size: 0.85rem; color: var(--ink-2);
    }
    .endpoints code { word-break: break-all; color: var(--ink); }

    @media (max-width: 40rem) {
      .qr-panel { grid-template-columns: 1fr; }
      .qr-panel figure { max-width: 16rem; }
    }
  </style>
{{end}}
