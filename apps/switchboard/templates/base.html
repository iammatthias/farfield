{{/* switchboard: the shared layout supplies the shell and masthead; only this
    app's own styles live here. The console is a log, so it is one table. */}}

{{define "styles"}}
  <style>
    .container { max-width: 64rem; }

    .summary {
      display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem;
      margin: 0.6rem 0 1.5rem;
      font: 0.78rem/1 var(--font-mono); opacity: 0.65;
    }

    table.admin { font-size: 0.85rem; }
    table.admin td { vertical-align: top; }
    table.admin td.when,
    table.admin td.route,
    table.admin td.ref { font-family: var(--font-mono); font-size: 0.78rem; }
    table.admin td.when { white-space: nowrap; opacity: 0.7; }
    table.admin td.body { max-width: 24rem; }
    table.admin td.body .text {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    table.admin td.reply { max-width: 16rem; opacity: 0.75; }

    /* The setup notice is the one thing worth shouting about: a half-configured
       switchboard looks identical to a working one until you text it. */
    .notice {
      border: 1px solid var(--ink); padding: 0.9rem 1.1rem;
      margin: 0 0 1.5rem; font-size: 0.9rem;
    }
  </style>
{{end}}
