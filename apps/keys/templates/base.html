{{/* keys: the shared layout supplies the shell and masthead, and the theme
    supplies fields, tables, table.stack and td.actions; only this app's own
    styles and partials live here. */}}

{{define "styles"}}
  <style>
    .container { max-width: 60rem; }

    table.admin td { vertical-align: middle; }
    table.admin td.mono { color: var(--ink-2); white-space: nowrap; }

    /* the counts line above the table — a technical readout */

    /* The one-time token reveal: the token alone on a wash, selectable in
       one tap, with its facts beneath as a readout. */
    .token {
      display: block; margin: var(--s-5) 0;
      padding: var(--s-4) var(--s-5);
      background: var(--wash); border-radius: var(--r-s);
      font: 400 0.95rem/1.5 var(--font-mono);
      word-break: break-all;
      user-select: all; -webkit-user-select: all;
    }
    .token-meta {
      display: grid; grid-template-columns: auto minmax(0, 1fr);
      gap: var(--s-1) var(--s-4); margin: 0 0 var(--s-6);
      font-size: 0.85rem;
    }
    .token-meta dt { line-height: 1.9; }
    .token-meta dd { margin: 0; }
    .token-use { color: var(--ink-2); }
  </style>
{{end}}
