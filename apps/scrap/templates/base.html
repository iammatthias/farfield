{{/* scrap: the shared layout supplies the shell and masthead;
    only this app's own styles and partials live here. */}}

{{define "styles"}}
  <style>
    /* technical readouts in a row: counts on manage, facts under a title */
    .summary, .meta {
      display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-4); align-items: baseline;
    }
    .summary { margin: 0 0 var(--s-3); }
    .meta { margin-top: var(--s-2); font: 0.78rem/1.4 var(--font-mono); color: var(--ink-2); }
    .meta .ttl { color: var(--warn); }

    /* authed token controls on the view page — quiet link-verbs */
    .token-controls { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-5); margin-top: var(--s-3); }
    .token-controls form { margin: 0; }
    .token-controls button.linklike { font-size: 0.85rem; color: var(--ink-2); }
    .token-controls button.linklike:hover { color: var(--accent); }

    /* code view — a wash well, no frame. The chroma palette is fixed light-
       mode hex in highlight.go, so the tokens are re-inked here from the theme
       and follow dark mode. */
    .code-wrap {
      margin-top: var(--s-5);
      background: var(--wash); border-radius: var(--r-s);
      overflow-x: auto;
    }
    .code-wrap pre.chroma {
      margin: 0; padding: var(--s-4) var(--s-4) var(--s-4) 0;
      background: transparent; color: var(--ink);
      font-size: 0.82rem; line-height: 1.6;
    }
    .code-wrap .chroma .line { display: block; width: 100%; }
    /* gutter: right-aligned numbers, receded in ink-3 */
    .code-wrap .chroma .ln, .code-wrap .chroma .lnt {
      display: inline-block; min-width: 3.2ch;
      margin-right: 1.5ch; padding: 0 0.7ch 0 1.5ch;
      text-align: right; color: var(--ink-3);
      user-select: none;
    }
    .code-wrap .chroma .lnlinks { text-decoration: none; color: inherit; }
    .code-wrap .chroma .k, .code-wrap .chroma .kt, .code-wrap .chroma .kc,
    .code-wrap .chroma .kd, .code-wrap .chroma .kn, .code-wrap .chroma .kp,
    .code-wrap .chroma .kr, .code-wrap .chroma .nf, .code-wrap .chroma .nc,
    .code-wrap .chroma .nt, .code-wrap .chroma .nb, .code-wrap .chroma .o { color: var(--ink); }
    .code-wrap .chroma .na, .code-wrap .chroma .p, .code-wrap .chroma .gi,
    .code-wrap .chroma .s, .code-wrap .chroma .s1, .code-wrap .chroma .s2,
    .code-wrap .chroma .sa, .code-wrap .chroma .sb, .code-wrap .chroma .sc,
    .code-wrap .chroma .sd, .code-wrap .chroma .sh, .code-wrap .chroma .sx,
    .code-wrap .chroma .sr, .code-wrap .chroma .ss, .code-wrap .chroma .dl { color: var(--ink-2); }
    .code-wrap .chroma .c, .code-wrap .chroma .c1, .code-wrap .chroma .cm,
    .code-wrap .chroma .cs, .code-wrap .chroma .ch, .code-wrap .chroma .cp,
    .code-wrap .chroma .cpf, .code-wrap .chroma .nd, .code-wrap .chroma .gu { color: var(--ink-3); }
    .code-wrap .chroma .se, .code-wrap .chroma .si, .code-wrap .chroma .m,
    .code-wrap .chroma .mi, .code-wrap .chroma .mf, .code-wrap .chroma .mh,
    .code-wrap .chroma .mo, .code-wrap .chroma .mb, .code-wrap .chroma .il { color: var(--accent); }
    .code-wrap .chroma .err, .code-wrap .chroma .gd { color: var(--bad); background: transparent; }
    /* #L10 single-line highlight (CSS only) + JS-applied range highlight */
    .code-wrap .chroma .line:target, .code-wrap .chroma .line.hl,
    .code-wrap .chroma .line:has([id]:target) { background: var(--select); }

    /* manage table */
    table.admin td.id, table.admin td.lang, table.admin td.num {
      font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2);
    }
    table.admin td { vertical-align: middle; }
    table.admin td.title {
      max-width: 18rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    table.admin td.actions { text-align: left; }
    @media (max-width: 46rem) { table.admin td.title { max-width: none; white-space: normal; } }

    /* manage filter bar: controls size to their content */
    form.filter-bar { align-items: center; }
    form.filter-bar select { width: auto; }
    form.filter-bar input[type="search"] { width: auto; flex: 1 1 12rem; max-width: 20rem; }

    /* create confirmation — the one-time secret handoff, rows on hairlines */
    .created .share-row {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s-1) var(--s-4);
      padding: var(--s-3) 0;
      border-top: 1px solid var(--rule);
    }
    .created .share-row:last-of-type { border-bottom: 1px solid var(--rule); }
    .created .share-row > .label { flex: 0 0 6.5rem; margin: 0; }
    .created .share-row code {
      flex: 1 1 16rem; min-width: 0;
      font-size: 0.8rem; word-break: break-all; user-select: all;
    }

    /* compose */
    .compose textarea { min-height: 16rem; }
    .compose .controls {
      display: grid; gap: 0 var(--s-5);
      grid-template-columns: repeat(auto-fit, minmax(min(11rem, 100%), 1fr));
    }
    .compose fieldset { border: 0; padding: 0; margin: var(--s-5) 0 0; }
    .compose fieldset legend {
      padding: 0; margin-bottom: var(--s-2);
      font-size: 0.8rem; font-weight: 500; color: var(--ink-2);
    }
    .compose .radio-row { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-5); }
    .compose .radio-row label {
      display: inline-flex; align-items: center; gap: var(--s-2);
      min-height: 40px; font-size: 0.9rem;
    }
    .compose .check { margin-top: var(--s-2); min-height: 40px; }
  </style>
{{end}}
