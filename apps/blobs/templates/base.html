{{/* blobs: the shared layout supplies the shell and masthead, and the theme
    supplies .thumb, .swatch, .pager, tables and the .modal shell. Only the
    pieces shaped like this app's media table and viewer live here. */}}

{{define "styles"}}
  <style>
    /* blobs admin — full-width, for the media table */
    .container { max-width: 86rem; }

    table.blobs td, table.blobs th { white-space: nowrap; }
    a.row { text-decoration: none; }
    a.row:hover { color: var(--accent); }

    /* hygiene report — reference lists inside table cells */
    details.reflist summary { cursor: pointer; color: var(--ink-2); }
    details.reflist[open] summary, details.reflist summary:hover { color: var(--ink); }
    .reflist ul, ul.reflist {
      list-style: none; padding: 0; margin: 0;
      display: grid; gap: var(--s-1);
    }
    details.reflist ul { margin-top: var(--s-2); }

    /* the media viewer is two-column here: the media on a wash beside its
       metadata. The shell (backdrop, close, :target behavior) is shared. */
    .modal .card { display: grid; grid-template-columns: minmax(0, 1fr) 19rem; }
    .modal .card > img, .modal .card > video {
      width: 100%; height: 100%; max-height: 88vh;
      object-fit: contain; background: var(--wash);
    }
    .modal .card > .media-well {
      display: flex; align-items: center; justify-content: center;
      min-height: 14rem; padding: var(--s-5); background: var(--wash);
    }
    .modal .card > .media-well.glyph { font-size: 2rem; color: var(--ink-3); }
    .modal .card > .media-well audio { width: 100%; }
    .modal .detail { padding: var(--s-5); min-width: 0; }
    .modal .detail h2 { font-size: 1rem; margin-bottom: var(--s-4); }
    .modal .detail dl {
      display: grid; grid-template-columns: auto minmax(0, 1fr);
      gap: var(--s-2) var(--s-4); margin-bottom: var(--s-5); font-size: 0.85rem;
    }
    .modal .detail dt { line-height: 1.9; }
    .modal .detail dd { margin: 0; word-break: break-all; }
    .modal .detail p { margin-bottom: var(--s-4); font-size: 0.85rem; }
    .modal .detail form button { margin-left: calc(-1 * 14px); }
    @media (max-width: 46rem) {
      .modal .card { grid-template-columns: 1fr; }
      .modal .card > img, .modal .card > video { max-height: 50vh; }
    }
  </style>
{{end}}
