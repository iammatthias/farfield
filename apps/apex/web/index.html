<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2e52">
<title>Farfield Systems</title>
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'><rect%20width='64'%20height='64'%20rx='12'%20fill='%230e222d'/><circle%20cx='32'%20cy='32'%20r='13'%20fill='none'%20stroke='%23f3e5d1'%20stroke-width='2'%20opacity='.8'/><circle%20cx='32'%20cy='32'%20r='3.5'%20fill='%23e59f67'/></svg>">
<meta name="description" content="A set of small, single-binary Go services — self-hosted backends for content and media, plus a few experiments that run entirely in the browser.">
<link rel="canonical" href="https://farfield.systems/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="farfield">
<meta property="og:url" content="https://farfield.systems/">
<meta property="og:title" content="Farfield Systems">
<meta property="og:description" content="A set of small, single-binary Go services — self-hosted backends for content and media, plus a few experiments that run entirely in the browser.">
<meta property="og:image" content="https://farfield.systems/frontispiece.jpg">
<meta property="og:image:width" content="1353">
<meta property="og:image:height" content="1162">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/static/fonts.css?v=__THEME_VERSION__">
<style>
  /* Farfield brand: an immense field, a distant signal, one reason to keep
     looking. The landscape carries the emotion; the type stays precise.
     Tokens from the visual style guide — Deep Space, Paper, Horizon. */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ff-space:#0e222d;
    --ff-paper:#f3e5d1;
    --ff-horizon:#e59f67;
    --ff-sky:#0d2e52; /* sampled from the plate's upper field */
    --font-display:"Newsreader",Georgia,serif;
    --font-sans:"Inter",system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  html,body{height:100%;width:100%}
  body{background:var(--ff-sky);overflow:hidden}

  /* The plate. Wide screens: full bleed, horizon kept low. Tall screens:
     the artwork holds the bottom of the page at its own scale and the flat
     field above extends its sky — the planet stays small. The point is
     distance. */
  .plate{
    position:fixed;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    /* The plate is mirrored: planet and figure live right, so the crop
       biases right and the open sky on the left yields last. */
    object-position:62% 78%;
  }
  @media (max-aspect-ratio: 9/10){
    body{overflow:auto}
    .plate{
      top:auto;bottom:0;
      height:auto;max-height:72vh;
      object-fit:contain;object-position:bottom;
      -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%);
      mask-image:linear-gradient(to bottom,transparent 0,#000 12%);
    }
  }

  /* Copy sits top-left, same as the os lander. The plate is mirrored so
     the open starry sky carries the type and the planet, figure, and path
     keep the right half to themselves. */
  .copy{
    position:fixed;
    top:clamp(4rem, 22vh, 16rem);
    left:clamp(1.5rem, 5vw, 4.5rem);
    right:clamp(1.25rem, 6vw, 6rem);
    max-width:40ch;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1.4rem;
    color:var(--ff-paper);
  }
  @media (max-aspect-ratio: 9/10){
    .copy{
      position:static;
      max-width:40ch;
      padding:calc(env(safe-area-inset-top) + 3.5rem) 7vw 0;
    }
  }

  h1{
    font-family:var(--font-display);
    font-weight:400;
    font-size:clamp(3rem, 8vw, 5.5rem);
    line-height:.96;
    letter-spacing:-.025em;
    text-wrap:balance;
    text-shadow:0 1px 3px rgba(8,14,26,.5);
  }
  .lede{
    font-family:var(--font-sans);
    font-weight:400;
    font-size:clamp(1rem, 1.4vw, 1.3rem);
    line-height:1.5;
    color:rgba(243,229,209,.88);
    max-width:36ch;
    text-wrap:pretty;
    text-shadow:0 1px 2px rgba(8,14,26,.55);
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:1.5rem;
  }
  .button-primary{
    font-family:var(--font-sans);
    font-weight:500;
    font-size:.95rem;
    color:var(--ff-space);
    background:var(--ff-horizon);
    border:1px solid var(--ff-horizon);
    border-radius:4px;
    padding:.6rem 1.2rem;
    text-decoration:none;
    transition:background 140ms ease-out,border-color 140ms ease-out;
  }
  .button-primary:hover{background:#eeb183;border-color:#eeb183}
  .button-primary:focus-visible{outline:2px solid var(--ff-horizon);outline-offset:2px}
  .status-link{
    font-family:var(--font-mono);
    font-size:.85rem;
    font-weight:500;
    letter-spacing:.08em;
    color:rgba(243,229,209,.92);
    text-decoration:none;
    border-bottom:1px solid rgba(243,229,209,.45);
    padding-bottom:2px;
    text-shadow:0 1px 2px rgba(14,34,45,.55);
    transition:color 140ms ease-out,border-color 140ms ease-out;
  }
  .status-link:hover{color:var(--ff-paper);border-color:rgba(243,229,209,.7)}
  .status-link:focus-visible{outline:2px solid var(--ff-horizon);outline-offset:3px}
</style>
</head>
<body>
<img class="plate" src="/frontispiece.webp" alt="A halftone-print landscape at dusk: a lone figure stands at the top of a winding hilltop path, watching an enormous planet rise over distant mountains beneath a deep-blue starry sky." fetchpriority="high">
<main class="copy">
  <h1>Farfield Systems</h1>
  <p class="lede">Small, single-binary services — self-hosted backends for content, media, and a few experiments.</p>
  <nav class="actions" aria-label="Primary">
    <a class="button-primary" href="/docs/">Documentation&nbsp;&rarr;</a>
    <a class="status-link" href="/status">status</a>
  </nav>
</main>
</body>
</html>
