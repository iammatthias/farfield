{{/* sideload: the shared layout supplies the shell and masthead;
    only this app's own styles and partials live here. */}}

{{define "styles"}}
  <style>
    .summary { margin: 0 0 var(--s-6); }
    .spaced { margin-top: var(--s-6); }
    .pending { color: var(--warn); }

    .page-title { margin-bottom: var(--s-2); }
    .page-title .muted { font-weight: 400; }

    /* meta line — mono facts under a heading */
    .meta {
      display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-4); align-items: baseline;
      margin-top: var(--s-2);
      font: 0.78rem/1.5 var(--font-mono); color: var(--ink-2);
    }
    .meta .cid { word-break: break-all; }

    /* tagline under the app title */
    .tagline { font-size: 1rem; margin-top: var(--s-2); color: var(--ink-2); }

    /* the install action — the cable-killer, a big tap target. It sits on
       the page, not on a plate; the button carries it. */
    .install {
      display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-5) var(--s-6);
      margin: var(--s-6) 0;
    }
    .install .lede { flex: 1 1 16rem; min-width: 0; }
    .install-btn { min-height: 48px; padding: 0 var(--s-6); font-size: 1rem; }
    .install .hint { margin-top: var(--s-3); }
    .install .qr { flex: 0 0 auto; width: 9rem; height: 9rem; }
    .install .qr svg { width: 100%; height: 100%; display: block; }
    .install .qr-cap {
      margin-top: var(--s-2); text-align: center;
      font: 0.68rem/1.3 var(--font-mono); color: var(--ink-2);
    }
    @media (max-width: 36rem) {
      .install .qr-wrap { display: none; }
      .standalone .install-btn { width: 100%; }
    }

    /* a row of fields that wraps: inputs grow, the button sits on the baseline */
    .form-row {
      display: flex; flex-wrap: wrap; gap: var(--s-3) var(--s-5); align-items: flex-end;
    }
    .form-row .field { margin: 0; flex: 1 1 10rem; min-width: 0; }
    .form-row + .actions, form.form-row { margin-top: var(--s-4); }
    section > .section-head + form.form-row,
    section > .hint + form.form-row { margin-top: 0; }
    .section-head + .hint { margin-bottom: var(--s-4); }

    /* shown-once share confirmation: label/value rows on hairlines */
    .share-row {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s-1) var(--s-4);
      padding: var(--s-3) 0; border-bottom: 1px solid var(--rule);
    }
    .share-row > .label { flex: 0 0 6rem; margin: 0; }
    .share-row code {
      flex: 1 1 16rem; min-width: 0;
      font-size: 0.8rem; word-break: break-all; user-select: all;
    }

    /* management tables */
    table.admin { font-size: 0.85rem; }
    table.admin td { vertical-align: middle; }
    table.admin td.mono, table.admin td.num {
      font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2);
    }
    table.admin td.udid { word-break: break-all; }

    /* rendered markdown (descriptions, changelogs) is writing: .prose */
    .prose.small { font-size: 0.98rem; }

    /* screenshots gallery — horizontal scroll of phone shots */
    .shots {
      display: flex; gap: var(--s-3); overflow-x: auto;
      margin: var(--s-5) 0; padding-bottom: var(--s-2);
      scroll-snap-type: x mandatory;
    }
    .shot { flex: 0 0 auto; scroll-snap-align: start; }
    .shot img {
      display: block; height: 22rem; width: auto; max-width: 80vw;
      border-radius: var(--r-s); background: var(--paper-2);
    }
    .shot figcaption {
      margin-top: var(--s-2); max-width: 12rem;
      font-size: 0.8rem; color: var(--ink-2);
    }

    /* versions — rows on hairlines under the section's horizon */
    .vcard { padding: var(--s-4) 0; border-bottom: 1px solid var(--rule); }
    .vcard .vhead {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s-1) var(--s-4);
    }
    .vcard .vver { font-weight: 500; }
    .vcard .vver .muted { font-weight: 400; }
    .vcard .vmeta {
      margin-left: auto; display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-4);
      font: 0.74rem/1.4 var(--font-mono); color: var(--ink-2);
    }
    .vcard .changelog { margin-top: var(--s-2); }
    /* Ink for the ordinary actions, red for the one that destroys a build. */
    .vactions {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s-4);
      margin-top: var(--s-2); font-size: 0.85rem;
    }
    .vactions form { margin: 0; display: inline; }
    .vactions button {
      min-height: 0; padding: 0; background: none;
      font: inherit; color: var(--bad);
      text-decoration: underline; text-underline-offset: 0.2em;
      text-decoration-color: var(--rule-strong);
    }
    .vactions button:hover { background: none; color: var(--bad); text-decoration-color: currentColor; }
    @media (pointer: coarse) {
      .vactions a, .vactions button { padding: 10px 0; }
    }

    /* screenshot manager (edit page) */
    .shot-manage {
      display: grid; gap: var(--s-5);
      grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
      margin: var(--s-5) 0;
    }
    .shot-manage figure { margin: 0; }
    .shot-manage img {
      display: block; width: 100%; height: 9rem; object-fit: contain;
      border-radius: var(--r-s); background: var(--paper-2);
    }
    .shot-manage .row { gap: var(--s-2); margin-top: var(--s-2); flex-wrap: nowrap; }
    .shot-manage input[type="text"] { flex: 1; min-width: 0; font-size: 0.85rem; }
    /* per-screenshot verbs are quiet: the page's one primary is Upload */
    .shot-manage button[type="submit"]:not(.danger) { background: transparent; color: var(--accent); }
    .shot-manage button[type="submit"]:not(.danger):hover { background: var(--wash); color: var(--accent); }
    .shot-manage .ord { display: inline-flex; }
    .shot-manage .ord button[type="submit"]:not(.danger) { color: var(--ink); padding: 0 var(--s-3); font-size: 1rem; }

    /* public pages */
    .standalone h1 + p, .standalone .tagline { margin-top: var(--s-2); }
    .standalone .fine { margin-top: var(--s-5); }
    .standalone details { margin-top: var(--s-6); }
    .standalone details summary { color: var(--ink-2); font-size: 0.9rem; cursor: pointer;
      padding: 10px 0; }
    .standalone details summary:hover { color: var(--ink); }
    .standalone .whats-new { margin-top: var(--s-6); }
    .standalone .whats-new .label { margin-bottom: var(--s-2); }
    .standalone > .prose { margin-top: var(--s-5); }
  </style>
{{end}}
