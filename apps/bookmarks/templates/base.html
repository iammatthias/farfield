{{/* bookmarks: the shared layout supplies the shell and masthead;
    only this app's own styles and partials live here. */}}

{{define "styles"}}
  <style>
    .container { max-width: 56rem; }

    /* breathing room for UI bits against the 1px black border.
       Native select arrows ignore padding in some browsers, so draw our own. */
    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 3rem;
      background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
        linear-gradient(135deg, var(--ink) 50%, transparent 50%);
      background-position: calc(100% - 1.25rem) 50%, calc(100% - 0.85rem) 50%;
      background-size: 0.45rem 0.45rem, 0.45rem 0.45rem;
      background-repeat: no-repeat;
    }
    textarea { padding-right: 1rem; padding-bottom: 1rem; }

    /* the bookmarks table: every column visible, one row per bookmark */
    table.admin { font-size: 0.85rem; }
    table.admin td.url { max-width: 22rem; }
    table.admin td.url a {
      display: inline-block; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      vertical-align: bottom;
    }
    table.admin td.cat { font-family: var(--font-mono); font-size: 0.78rem; opacity: 0.7; }
    table.admin td { vertical-align: middle; }
    .summary {
      display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem;
      margin: 0.6rem 0 1.5rem;
      font: 0.78rem/1 var(--font-mono); opacity: 0.65;
    }
  </style>
{{end}}
