{{/* bookmarks: the shared layout supplies the shell and masthead, and the
    theme supplies fields, tables, table.stack and td.actions; only this
    app's own styles and partials live here. */}}

{{define "styles"}}
  <style>
    .container { max-width: 56rem; }

    /* the bookmarks table: every column visible, one row per bookmark */
    table.admin td { vertical-align: middle; }
    table.admin td.url { max-width: 22rem; }
    table.admin td.url a {
      display: inline-block; max-width: 100%; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      vertical-align: bottom;
    }
    table.admin td.cat { color: var(--ink-2); }

    /* the counts line above the table — a technical readout */

    /* fetched metadata on the edit form: a key/value readout */
    .fetched {
      display: grid; grid-template-columns: auto minmax(0, 1fr);
      gap: var(--s-1) var(--s-4); margin-top: var(--s-3);
      font-size: 0.85rem;
    }
    .fetched dt { line-height: 1.9; }
    .fetched dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  </style>
{{end}}
