{{/* pulse: the shared layout supplies the shell and masthead;
    only this app's own styles and partials live here. */}}

{{define "styles"}}
  <style>
    /* telemetry tables: mono numerals, tight rows */
    table.telemetry { font-size: 0.85rem; }
    table.telemetry td { vertical-align: middle; }
    table.telemetry td.num { font-family: var(--font-mono); font-size: 0.8rem; white-space: nowrap; }
    table.telemetry td.mono { font-size: 0.78rem; overflow-wrap: anywhere; }
    svg.spark { display: inline-block; vertical-align: middle; color: var(--ink); }
    svg.bars { width: 100%; height: 72px; color: var(--accent); }
    .err-text { color: var(--bad); font-family: var(--font-mono); font-size: 0.78rem; }

    /* the traffic filter form lines up as an instrument row */
    form.filters { display: flex; flex-wrap: wrap; gap: var(--s-3) var(--s-5); align-items: end; }
    form.filters .field { margin: 0; }
    form.filters input, form.filters select { width: auto; }
    .traffic-cols { margin-top: var(--s-7); }
  </style>
{{end}}
