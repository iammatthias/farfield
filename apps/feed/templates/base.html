{{/* feed: the shared layout supplies the shell and masthead;
    only this app's own styles and partials live here. */}}

{{define "styles"}}
  <style>
    /* The stream reads at a narrow measure; the composer's .doc-page
       constrains itself, so the post form keeps the normal container. */
    .container:not(:has(.doc-page)) { max-width: calc(44rem + 2 * var(--gutter)); }

    /* feed — dated notes separated by horizons, not boxes */
    .post { padding: var(--s-5) 0; border-bottom: 1px solid var(--rule); }
    .post:last-of-type { border-bottom: 0; }
    .post-meta {
      display: flex; gap: var(--s-1) var(--s-4); flex-wrap: wrap; align-items: baseline;
      margin-bottom: var(--s-2);
    }
    /* Posts are writing, not chrome — they take the document face. */
    .post-body {
      display: flex; flex-direction: column; gap: var(--s-3);
      overflow-wrap: anywhere;
      font: 400 1.1rem/1.6 var(--font-doc);
    }
    /* Markdown blocks: vertical rhythm comes from the flex gap. */
    .post-body > * { margin: 0; }
    .post-body ul, .post-body ol { padding-left: 1.3rem; }
    .post-body blockquote {
      border-left: 2px solid var(--rule-strong);
      padding-left: var(--s-4); color: var(--ink-2); font-style: italic;
    }
    .post-body h1, .post-body h2, .post-body h3, .post-body h4 { font-size: 1.1rem; font-weight: 500; }
    .post-body img, .post-body video { border-radius: var(--r-s); }
    .post-body audio.blob-media.inline, .post-body video.blob-media.inline { width: min(100%, 32rem); }
    .blob-file { word-break: break-all; }
    .post-actions {
      display: flex; gap: var(--s-5); align-items: baseline; margin-top: var(--s-3);
      font-size: 0.85rem;
    }
    .post-actions a { color: var(--ink-2); }
    .post-actions a:hover { color: var(--accent); }
    .post-actions form { display: inline; }
    .post-actions button.danger {
      min-height: 0; padding: 0; background: transparent;
      font: inherit; text-decoration: underline; text-underline-offset: 0.2em;
      text-decoration-color: var(--rule-strong);
    }
    .post-actions button.danger:hover { background: transparent; text-decoration-color: currentColor; }
    @media (pointer: coarse) {
      .post-actions a, .post-actions button.danger { display: inline-flex; align-items: center; min-height: 40px; }
    }
  </style>
{{end}}
