{{/* feed: the shared layout supplies the shell and masthead;
    only this app's own styles and partials live here. */}}

{{define "styles"}}
  <style>
    .container { max-width: 46rem; }
    /* The composer page carries the document-first edit layout, which needs
       the theme's full-width canvas — the 46rem cap suits only the stream. */
    .container:has(.edit-layout) { max-width: 72rem; }

    /* feed — a ruled stream of dated notes */
    .post { padding: 1.4rem 0; border-bottom: 1px solid var(--hairline); }
    .post:last-child { border-bottom: 0; }
    .post-meta {
      display: flex; gap: 0.85rem; flex-wrap: wrap; align-items: baseline;
      margin-bottom: 0.5rem;
      font-family: var(--font-mono); font-size: 0.75rem;
    }
    .post-meta .when { opacity: 0.55; }
    .post-meta .tag { opacity: 0.55; }
    .post-body {
      display: flex; flex-direction: column; gap: 0.6rem;
      word-break: break-word;
    }
    /* Markdown blocks: vertical rhythm comes from the flex gap. */
    .post-body p, .post-body ul, .post-body ol,
    .post-body blockquote, .post-body pre,
    .post-body h1, .post-body h2, .post-body h3, .post-body h4 { margin: 0; }
    .post-body ul, .post-body ol { padding-left: 1.3rem; }
    .post-body blockquote {
      border-left: 2px solid var(--hairline);
      padding-left: 0.8rem; opacity: 0.8;
    }
    .post-body code { font-family: var(--font-mono); font-size: 0.85em; background: var(--wash); padding: 0.1em 0.3em; }
    .post-body pre { background: var(--wash); padding: 0.6rem 0.8rem; overflow-x: auto; }
    .post-body pre code { background: transparent; padding: 0; }
    .post-body h1, .post-body h2, .post-body h3, .post-body h4 { font-size: 1rem; }
    .blob-media.inline { display: inline-block; vertical-align: middle; max-width: 100%; }
    .blob-media.standalone { display: block; max-width: 100%; }
    .blob-media { border-radius: var(--r-s); }
    .post-body audio.blob-media.inline, .post-body video.blob-media.inline { width: min(100%, 32rem); }
    .blob-file { word-break: break-all; }
    .post-actions {
      display: flex; gap: 1.25rem; margin-top: 0.8rem;
      font-family: var(--font-mono); font-size: 0.78rem;
    }
    .post-actions form { display: inline; }
    .post-actions button {
      border: 0; background: transparent; padding: 0;
      color: var(--accent); text-decoration: underline;
      text-underline-offset: 0.2em; font: inherit;
    }
    .post-actions button:hover { background: transparent; text-decoration-thickness: 2px; }
  </style>
{{end}}
