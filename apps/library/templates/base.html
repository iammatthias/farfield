{{/* library: the shared layout supplies the shell and masthead, and the
    theme supplies tables, table.stack and td.actions; only this app's own
    styles and partials live here. */}}

{{define "styles"}}
  <style>
    /* opds admin — full-width, for the catalogue table */
    .container { max-width: 72rem; }

    table.books th { white-space: nowrap; }
    table.books td { vertical-align: middle; }
    /* a cover is the image itself on the page — no frame */
    .cover {
      width: 40px; height: 56px; max-width: none; object-fit: cover; display: block;
      border-radius: var(--r-s); background: var(--paper-2);
    }
    .cover.placeholder {
      display: flex; align-items: center; justify-content: center;
      font: 500 0.6rem/1 var(--font-mono); letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--ink-3);
    }
    td.title { font-weight: 500; }
    td.meta { font-size: 0.85rem; color: var(--ink-2); }
  </style>
{{end}}
