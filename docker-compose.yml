      - BOOKMARKS_READ_KEY=${BOOKMARKS_READ_KEY:-}
      - KEYS_DB_PATH=/data/keys.sqlite
      - COOKIE_SECURE=true
    volumes:
      - ./data:/data

  qr:
    <<: *defaults
    build:
      context: .
      args: { APP: qr }
    image: farfield-qr
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${QR_PORT:-8794}:8794"
    environment:
      - HOST=0.0.0.0
      - QR_PORT=8794
      - QR_DB_PATH=/data/qr.sqlite
      - QR_API_KEY=${QR_API_KEY:-}
      - QR_READ_KEY=${QR_READ_KEY:-}
      - KEYS_DB_PATH=/data/keys.sqlite
      - QR_PUBLIC_URL=${QR_PUBLIC_URL:-https://qr.farfield.systems}
      - PASSWORD=${PASSWORD:-changeme}
