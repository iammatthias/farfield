      - BARD_PORT=8795
      - BARD_DB_PATH=/data/bard.sqlite
    volumes:
      - ./data:/data

  dead-presidents:
    <<: *defaults
    build:
      context: .
      args: { APP: dead-presidents }
    image: farfield-dead-presidents
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${DEAD_PRESIDENTS_PORT:-8796}:8796"
    environment:
      - HOST=0.0.0.0
      - DEAD_PRESIDENTS_PORT=8796
      - DEAD_PRESIDENTS_DB_PATH=/data/dead-presidents.sqlite
    volumes:
      - ./data:/data

  pulse:
    <<: *defaults
    build:
      context: .
      args: { APP: pulse }
    image: farfield-pulse
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${PULSE_PORT:-8798}:8798"
    environment:
      - HOST=0.0.0.0
      - PULSE_PORT=8798
      - PULSE_DB_PATH=/data/pulse.sqlite
      - PASSWORD=${PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - COOKIE_SECURE=true
    volumes:
      - ./data:/data

  daily:
    <<: *defaults
    build:
      context: .
      args: { APP: daily }
    image: farfield-daily
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${DAILY_PORT:-8792}:8792"
