      args: { APP: keys }
    image: farfield-keys
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${KEYS_PORT:-8801}:8801"
    environment:
      - HOST=0.0.0.0
      - KEYS_PORT=8801
      - KEYS_DB_PATH=/data/keys.sqlite
      - PASSWORD=${PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
