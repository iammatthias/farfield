      - DAILY_PORT=8792
      - DAILY_DB_PATH=/data/daily.sqlite
      - NASA_API_KEY=${NASA_API_KEY:-DEMO_KEY}
    volumes:
      - ./data:/data

  bookmarks:
    <<: *defaults
    build:
      context: .
      args: { APP: bookmarks }
    image: farfield-bookmarks
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${BOOKMARKS_PORT:-8793}:8793"
    environment:
      - HOST=0.0.0.0
      - BOOKMARKS_PORT=8793
      - BOOKMARKS_DB_PATH=/data/bookmarks.sqlite
      - PASSWORD=${PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
