# Production compose for farfield apps. Built from source on the host —
# `gnar-deploy farfield` runs `docker compose up -d --build` here.
#
# Every app builds from the single root Dockerfile (APP build arg) and shares
# a bind-mounted ./data directory (gitignored, host-side, so it survives
# rebuilds). Each app owns its own <app>.sqlite within it; the backup app
# reads them all. Secrets like ${PASSWORD} come from a .env beside this file.

x-defaults: &defaults
  restart: unless-stopped
  # The images run as uid/gid 65532 (distroless :nonroot), so the bind-mounted
  # ./data must be writable by that uid. On an existing deployment whose data
  # directory was created by the previous root containers, this is a ONE-TIME
  # step before the first `up` — without it every app fails to open its
  # database:
  #
  #     sudo chown -R 65532:65532 ./data
  #
  # Nothing here needs a privileged capability: the apps listen above 1024 and
  # only touch their own files, so they drop every capability and are barred
  # from regaining any through setuid binaries.
  # Published ports bind to FARFIELD_BIND_IP, never every interface. The
  # default (loopback) is right for local dev. On a host where the reverse
  # proxy is itself a container reaching the apps through
  # host.docker.internal, set this to the docker bridge gateway — 172.17.0.1
  # — so ingress still resolves while the LAN cannot reach the apps directly.
  # Binding 0.0.0.0 would put every admin UI on the local network, where a
  # client can also forge the forwarded-IP headers the rate limiters key on.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # Resource ceilings, not reservations — unused headroom stays free for the
  # host. Measured 2026-07-31: every app idles at 14-22 MiB, so 512m is ~25x
  # real usage. The point is not to run apps close to a limit, it is that a
  # leak or a runaway request in one service cannot take the other fifteen
  # down with it. blobs and library override this below; they stream uploads.
  mem_limit: 512m
  # A quarter of the 16-core host. Enough that a single app can still burst,
  # bounded enough that it cannot starve the rest or the reverse proxy.
  cpus: 4.0
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "/app", "health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

services:
  blobs:
    <<: *defaults
    build:
      context: .
      args: { APP: blobs }
    image: farfield-blobs
    # Streams uploads of up to ~100 MiB and spools them to disk rather than
    # memory, but gzip and hashing buffers make the peak lumpier than an
    # idle app's. Double the fleet ceiling rather than tune it precisely.
    mem_limit: 1g
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${BLOBS_PORT:-8789}:8789"
    environment:
      - HOST=0.0.0.0
      - BLOBS_PORT=8789
      - BLOBS_DB_PATH=/data/blobs.sqlite
      - BLOBS_BACKEND=${BLOBS_BACKEND:-r2}
      - BLOBS_DIR=/data/blobs
      # Uploads stage here before hashing, so large media never has to fit in
      # memory. On the mounted volume, not the container's writable layer.
      - BLOBS_SPOOL_DIR=/data/blob-spool
      - PASSWORD=${PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - BLOBS_API_KEY=${BLOBS_API_KEY:-}
      - BLOBS_READ_KEY=${BLOBS_READ_KEY:-}
      - CONTENT_URL=http://content:8787
      - CONTENT_API_KEY=${CONTENT_API_KEY:-}
      - FEED_URL=http://feed:8788
      - FEED_READ_KEY=${FEED_READ_KEY:-}
      - KEYS_DB_PATH=/data/keys.sqlite
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - COOKIE_SECURE=true
    volumes:
      - ./data:/data

  library:
    <<: *defaults
    build:
      context: .
      args: { APP: library }
    image: farfield-library
    # LIBRARY_MAX_UPLOAD is 400 MiB and tus reassembles chunks on disk; same
    # reasoning as blobs.
    mem_limit: 1g
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${LIBRARY_PORT:-8797}:8797"
    environment:
      - HOST=0.0.0.0
      - LIBRARY_PORT=8797
      - LIBRARY_DB_PATH=/data/library.sqlite
      - LIBRARY_BACKEND=${LIBRARY_BACKEND:-r2}
      - LIBRARY_DIR=/data/library
      - PASSWORD=${PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - LIBRARY_API_KEY=${LIBRARY_API_KEY:-}
      - LIBRARY_UPLOAD_KEY=${LIBRARY_UPLOAD_KEY:-}
      - LIBRARY_MAX_UPLOAD=${LIBRARY_MAX_UPLOAD:-}
      - LIBRARY_TUS_DIR=/data/tus-staging
      - KEYS_DB_PATH=/data/keys.sqlite
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - COOKIE_SECURE=true
    volumes:
      - ./data:/data

  content:
    <<: *defaults
    build:
      context: .
      args: { APP: content }
    image: farfield-content
    depends_on:
      blobs:
        condition: service_healthy
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${CONTENT_PORT:-8787}:8787"
    environment:
      - HOST=0.0.0.0
      - CONTENT_PORT=8787
      - CONTENT_DB_PATH=/data/content.sqlite
      - PASSWORD=${PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - CONTENT_API_KEY=${CONTENT_API_KEY:-}
      - CONTENT_READ_KEY=${CONTENT_READ_KEY:-}
      - FEED_URL=http://feed:8788
      - FEED_READ_KEY=${FEED_READ_KEY:-}
      - BOOKMARKS_URL=http://bookmarks:8793
      - BOOKMARKS_READ_KEY=${BOOKMARKS_READ_KEY:-}
      - KEYS_DB_PATH=/data/keys.sqlite
      - BLOBS_URL=http://blobs:8789
      - BLOBS_API_KEY=${BLOBS_API_KEY:-}
      - BLOBS_PUBLIC_URL=${BLOBS_PUBLIC_URL:-https://blobs.farfield.systems}
      - CONTENT_PUBLIC_URL=${CONTENT_PUBLIC_URL:-https://content.farfield.systems}
      - COOKIE_SECURE=true
    volumes:
      - ./data:/data

  feed:
    <<: *defaults
    build:
      context: .
      args: { APP: feed }
    image: farfield-feed
    depends_on:
      blobs:
        condition: service_healthy
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${FEED_PORT:-8788}:8788"
    environment:
      - HOST=0.0.0.0
      - FEED_PORT=8788
      - FEED_DB_PATH=/data/feed.sqlite
      - PASSWORD=${PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - FEED_API_KEY=${FEED_API_KEY:-}
      - FEED_READ_KEY=${FEED_READ_KEY:-}
      - KEYS_DB_PATH=/data/keys.sqlite
      - BLOBS_URL=http://blobs:8789
      - BLOBS_API_KEY=${BLOBS_API_KEY:-}
      - CONTENT_URL=http://content:8787
      - CONTENT_API_KEY=${CONTENT_API_KEY:-}
      - BLOBS_PUBLIC_URL=${BLOBS_PUBLIC_URL:-https://blobs.farfield.systems}
      - CONTENT_PUBLIC_URL=${CONTENT_PUBLIC_URL:-https://content.farfield.systems}
      - COOKIE_SECURE=true
    volumes:
      - ./data:/data

  apex:
    <<: *defaults
    build:
      context: .
      args: { APP: apex }
    image: farfield-apex
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${APEX_PORT:-8790}:8790"
    environment:
      - HOST=0.0.0.0
      - APEX_PORT=8790
      - APEX_DB_PATH=/data/apex.sqlite
    volumes:
      - ./data:/data

  bard:
    <<: *defaults
