  backup:
    <<: *defaults
    build:
      context: .
      args: { APP: backup }
    image: farfield-backup
    depends_on:
      blobs:
        condition: service_healthy
    ports:
      - "${FARFIELD_BIND_IP:-127.0.0.1}:${BACKUP_PORT:-8791}:8791"
    environment:
      - HOST=0.0.0.0
      - BACKUP_PORT=8791
      - BACKUP_DB_PATH=/data/backup.sqlite
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-6h}
      - CONTENT_DB_PATH=/data/content.sqlite
      - FEED_DB_PATH=/data/feed.sqlite
      - BLOBS_DB_PATH=/data/blobs.sqlite
      - PASSWORD=${PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - BLOBS_URL=http://blobs:8789
      - BLOBS_API_KEY=${BLOBS_API_KEY:-}
      - COOKIE_SECURE=true
    volumes:
      - ./data:/data
