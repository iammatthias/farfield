    environment:
      - HOST=0.0.0.0
      - SIDELOAD_PORT=8800
      - SIDELOAD_DB_PATH=/data/sideload.sqlite
      - SIDELOAD_DIR=/data/sideload-blobs
      - SIDELOAD_BACKEND=${SIDELOAD_BACKEND:-local}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - SIDELOAD_API_KEY=${SIDELOAD_API_KEY:-}
